name: Publish prebuilt Web Royale site
# Manual only: committing this private project does not publish its artwork.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Upload the prebuilt website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
