	CaptureDragTime=300
	HideDistance=200
	CaptureCooldown=300
	PullFileName="sc/chr_goblin_cage_evolution.sc"
	StretchingClipExportName="Flex_Arm"
	PullEndClipExportName="Flex_Arm_Hand"
	PullCenterOffsetX=0
	PullCenterOffsetY=-1000
	PullEndClipScale=30
	StretcingClipWidthScale=25
	GrabPointOffset=500
	HideAction="GoblinCage_EV1_hide_captured_unit"
