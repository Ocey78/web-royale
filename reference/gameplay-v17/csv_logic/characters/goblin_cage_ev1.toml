	PullEndIdleStartFrame="idle_start"
	PullEndIdleEndFrame="idle_end"
	PullEndGrabStartFrame="grab_start"
	PullEndGrabEndFrame="grab_end"
	CaptureAnimationStartLabel="fight_idle_start"
	CaptureAnimationEndLabel="fight_idle_end"
	IdleAnimationStartLabel="idle_start"
	IdleAnimationEndLabel="idle_stop"
	PullGrabEffect="vfx_goblincage_evo_grab_01"
	PullStartEffect="vfx_goblincage_evo_grab"
	OnCaptureAction="goblin_cage_ev1_fight_effect"
	BuffDuringCapture = "GoblinCage_EV1_incapacitate_target"
	StatsTags.Damage = "capture_damage"
	StatsTags.CaptureRadius = "capture_radius"
	StatsTags.HitSpeed = "capture_hit_speed"
	[BUFF.GoblinCage_EV1_incapacitate_target]
	Rarity = "Common"
	SpeedMultiplier = -100
	HitSpeedMultiplier = -100
	SpawnSpeedMultiplier = -100
	EnableStacking = true
[ACTION.goblin_cage_ev1_fight_effect]
	ClassType="ActionPlayEffect"
	Effect = "vfx_goblincage_evo_fight"
	EffectFlags = "Looping,LinkLifeToActionLife"
	Singleton=true
	PauseIfTrue = "COMBAT_DISABLED()"
	ForceStopIfTrue="!HAS_CAPTURE()"
[ACTION.GoblinCage_EV1_hide_captured_unit]
	ClassType="ActionHide"
	Singleton=true
	HealthBarYOffset=-22
