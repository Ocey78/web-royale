[[EXT.MegaKnight_EV1.AttackSequenceList]]
	Damage = 105
	
[[EXT.MegaKnight_EV1.AttackSequenceList]]
	Damage = 105
[ACTION.MegaKnight_EV1_uppercut_start_group]
	ClassType="ActionGroup"
    SubActions = ["MegaKnight_EV1_Update_Do_Uppercut_Counter", "MegaKnight_EV1_uppercut"]
    SubActionsDelay = [0,0]
[ACTION.MegaKnight_EV1_Update_Do_Uppercut_Counter]
	ClassType = "ActionSetVariable"
	Variable  = "MegaKnight_EV1_Do_Uppercut_Counter"
	Value     = "(MegaKnight_EV1_Do_Uppercut_Counter + 1) % 2"
	NextAction = "MegaKnight_EV1_select_attack_sequence"
	NextActionWait = true
[ACTION.MegaKnight_EV1_select_attack_sequence]
	ClassType = "ActionSelect"
	SubActions = [
		"MegaKnight_EV1_set_attack0",
		"MegaKnight_EV1_set_attack1"
		]
	PerActionConditions = [
		"MegaKnight_EV1_Do_Uppercut_Counter == 0",
	]
[ACTION.MegaKnight_EV1_set_attack0]
	ClassType="ActionSetAttackSequenceIndex"
	AttackIndex = 0
[ACTION.MegaKnight_EV1_set_attack1]
	ClassType="ActionSetAttackSequenceIndex"
	AttackIndex = 1
[ACTION.MegaKnight_EV1_uppercut]
    ClassType="ActionMegaKnightUppercut"
	ExecuteIfTrue = "MegaKnight_EV1_Do_Uppercut_Counter % 2 == 0"
    PushBackStrength=4000
    ActionOnTargets="MegaKnight_EV1_uppercut_target"
    IgnorePushbackChecks=true
    DoFollowUpJump=false
    DashFollowUpMinRange=3500
    DashFollowUpMaxRange=5000
    StatsTags.PushBackStrength = "pushback"
[ACTION.MegaKnight_EV1_uppercut_target]
    ClassType="ActionGroup"
    SubActions = ["MegaKnight_EV1_uppercut_send_flying","MegaKnight_EV1_flying_FX","MegaKnight_EV1_flying_FX2","MegaKnight_EV1_flying_FX3","MegaKnight_EV1_uppercut_root"]
    SubActionsDelay = [ 0, 0, 0, 1050, 1000]
[ACTION.MegaKnight_EV1_uppercut_send_flying]
    ClassType="ActionKnockback"
    Duration=900
    Height=8000
    AbortIfInstigatorDies=false
[ACTION.MegaKnight_EV1_flying_FX]
    ClassType="ActionPlayEffect"
    Effect="mega_knight_evo_pushback"
    EffectFlags="FollowParent,FilterCanModifyTransform,ApplyToAttachedChildCharacters"
    OverrideDuration=1000
[ACTION.MegaKnight_EV1_flying_FX2]
    ClassType="ActionPlayEffect"
    Effect="vfx_megaknight_evo_enemy_flying"
    EffectFlags="FollowParent"
    OverrideDuration=1000
[ACTION.MegaKnight_EV1_flying_FX3]
    ClassType="ActionPlayEffect"
    Effect="vfx_megaknight_evo_enemy_landing"
    EffectFlags="FollowParent,FilterCanModifyTransform,ApplyToAttachedChildCharacters"
[ACTION.MegaKnight_EV1_uppercut_root]
    ClassType="ActionWithDuration"
    ActionDuration=400
    GameTagsToSet="NO_MOVE"
[EXT.MegaKnight_EV1_appear]
