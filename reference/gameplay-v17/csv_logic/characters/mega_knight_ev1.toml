	AnimationsKeepLastFrame=true
	TryToFinishAttackAnimationBeforeNextAttack=true
    DeathEffect="mega_knight_evolution_die"
    SpawnEffect="vfx_megaknight_evo_deploy"
    DamageEffect="vfx_megaknight_evo_hit"
    MoveEffect="mega_knight_evo_steps"
    AttackStartEffect="mega_knight_evo_attack_start"
    DashStartEffect="vfx_megaknight_evo_dash_start"
    LandingEffect="vfx_megaknight_evo_dash_end"
    DashEffect="mega_knight_evo_dashing"
