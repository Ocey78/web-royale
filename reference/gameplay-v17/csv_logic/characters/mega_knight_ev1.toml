[VARIABLE.MegaKnight_EV1_Do_Uppercut_Counter]
	DefaultValue = 0
[EXT.MegaKnight_EV1]
	Base="CHARACTER.MegaKnight"
    FileName="sc/chr_mega_knight_evolution.sc"
    BlueExportName="megaknight_evolution"
    RedExportName="megaknight_evolution_red"
    CustomSpawnFilter="filter_card_evolution"
