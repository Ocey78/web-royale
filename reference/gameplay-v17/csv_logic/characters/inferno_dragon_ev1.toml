[VARIABLE.InfernoDragon_EV1_AttackCount]
[VARIABLE.InfernoDragon_EV1_AttackDecayCounter]
[VARIABLE.InfernoDragon_EV1_DecayTime]
DefaultValue = 7000
[EXT.InfernoDragon_EV1]
	Base = "CHARACTER.InfernoDragon"
	ClonedVersion = "InfernoDragon"
	FileName = "sc/chr_inferno_dragon_evolution.sc"
AttackSequence = [0, 1, 2, 3]
	AttackSequenceMode = "Manual"
	OnAttackAction = "InfernoDragon_EV1_IncrementAttackCount"
	OnStartingAttackAction = "InfernoDragon_EV1_ResetDecayCounter"
	OnStartingAction = "InfernoDragon_EV1_ConstantTicker"
    Scale = 110
   	BlueExportName = "inferno_dragon_evo"
    RedExportName = "inferno_dragon_evo_enemy"
	SpawnEffect = "InfernoDragon_EV1_Deploy2"
	MoveEffect = "InfernoDragon_EV1_steps"
	DeathEffect = "InfernoDragon_EV1_die2"
	DamageEffect = "InfernoDragon_EV1_hit_lvl1"
	ProjectileEffect = "InfernoDragon_EV1_attack"
	AttackStartEffect = "InfernoDragon_EV1_attack_start"
	OnStartingClientActions=["InfernoDragon_EV1_Barrel", "InfernoDragon_EV1_Glow"]
	HealthBar = "Medium_EV1"
		DeployBaseAnimExportName="filter_deploy_unit_legendary"
		CustomSpawnFilter="filter_card_evolution"
	StatsTags.Hitpoints = "hitpoints"
    StatsTags.HitSpeed = "hit_speed"
	StatsTags.Targets = "targets"
	StatsTags.Range = "range"
    StatsTags.Speed = "speed"
[ACTION.InfernoDragon_EV1_IncrementAttackCount]
	ClassType = "ActionSetVariable"
	Variable = "InfernoDragon_EV1_AttackCount"
	Value = "min(50, InfernoDragon_EV1_AttackCount + 1)"
	NextActionWait = true
	NextAction = "InfernoDragon_EV1_ResetDecayCounter"
[[EXT.InfernoDragon_EV1.AttackSequenceList]]
	Damage = 14
	TargettedDamageEffect = "InfernoDragon_EV1_beam_lvl1"
	FlameEffect = "InfernoDragon_EV1_muzzle"
	VisualHitSpeed = 1200
	StatsTags.Damage = "min_damage"
[[EXT.InfernoDragon_EV1.AttackSequenceList]]
	Damage = 47
	TargettedDamageEffect = "InfernoDragon_EV1_beam_lvl2"
	FlameEffect = "InfernoDragon_EV1_muzzle_stage2"
	VisualHitSpeed = 1200
[[EXT.InfernoDragon_EV1.AttackSequenceList]]
	Damage = 165
	TargettedDamageEffect = "InfernoDragon_EV1_beam_lvl3"
	FlameEffect = "InfernoDragon_EV1_muzzle_stage3"
	VisualHitSpeed = 1200
	StatsTags.Damage = "max_damage"
[[EXT.InfernoDragon_EV1.AttackSequenceList]]
	Damage = 330
	TargettedDamageEffect = "InfernoDragon_EV1_beam_lvl4"
	FlameEffect = "InfernoDragon_EV1_muzzle_stage4"
	VisualHitSpeed = 1200
[ACTION.InfernoDragon_EV1_ConstantTicker]
	ClassType = "ActionInterval"
	Interval = 50
	[ACTION.InfernoDragon_EV1_ConstantTicker.ActionToExecute]
		ClassType = "ActionGroup"
		SubActions = [ "InfernoDragon_EV1_UpdateDecayCounter", "InfernoDragon_EV1_UpdateAttackSequence", "InfernoDragon_EV1_CheckCombatDisabled" ]
[ACTION.InfernoDragon_EV1_UpdateAttackSequence]
	ClassType = "ActionSelect"
	PerActionConditions = [
		"InfernoDragon_EV1_AttackCount < 4",
		"InfernoDragon_EV1_AttackCount < 9",
		"InfernoDragon_EV1_AttackCount < 49"
	]
	SubActions = [
		{ ClassType = "ActionSetAttackSequenceIndex", AttackIndex = 0 },
		{ ClassType = "ActionSetAttackSequenceIndex", AttackIndex = 1 },
		{ ClassType = "ActionSetAttackSequenceIndex", AttackIndex = 2 },
		{ ClassType = "ActionSetAttackSequenceIndex", AttackIndex = 3 }
	]
	[ACTION.InfernoDragon_EV1_UpdateAttackSequence.NextAction]
		ClassType = "ActionWithDuration"
		ActionDuration = 50
		GameTagsToSet = "UNIT_CUSTOM_TAG_1"
		ExecuteIfTrue = "InfernoDragon_EV1_AttackCount >= 4"
[ACTION.InfernoDragon_EV1_UpdateDecayCounter]
	ClassType = "ActionSetVariable"
	Variable = "InfernoDragon_EV1_AttackDecayCounter"
	Value = "max(0, InfernoDragon_EV1_AttackDecayCounter - 50)"
	NextActionWait = true
	[ACTION.InfernoDragon_EV1_UpdateDecayCounter.NextAction]
		ClassType = "ActionGroup"
		ExecuteIfTrue = "InfernoDragon_EV1_AttackDecayCounter == 0"
		SubActions = [
			"InfernoDragon_EV1_DoAttackDecay",
			"InfernoDragon_EV1_ResetDecayCounter",
			"InfernoDragon_EV1_UpdateDamageStateVFX",
			"InfernoDragon_EV1_Reset_Attack_Level_Effect"
		]
[ACTION.InfernoDragon_EV1_Reset_Attack_Level_Effect]
	ClassType="ActionPlayEffect"
	Effect = "evo_inferno_dragon_fizzle"
	EffectFlags = "FollowParent,ParticlesFollowParent"
	ExecuteIfTrue = "UNIT_CUSTOM_TAG_1"
[ACTION.InfernoDragon_EV1_CheckCombatDisabled]
	ClassType = "ActionSetVariable"
	ExecuteIfTrue = "COMBAT_DISABLED"
	Variable = "InfernoDragon_EV1_AttackCount"
	Value = "0"
	NextAction = "InfernoDragon_EV1_UpdateDamageStateVFX"
[ACTION.InfernoDragon_EV1_ResetDecayCounter]
	ClassType = "ActionSetVariable"
	Variable = "InfernoDragon_EV1_AttackDecayCounter"
	
	Value = "InfernoDragon_EV1_DecayTime"
	NextAction = "InfernoDragon_EV1_UpdateDamageStateVFX"
[ACTION.InfernoDragon_EV1_DoAttackDecay]
	ClassType = "ActionSelect"
	PerActionConditions = [
		"InfernoDragon_EV1_AttackCount >= 49",
		"InfernoDragon_EV1_AttackCount >= 9"
	]
	SubActions = [
		{ ClassType = "ActionSetVariable", Variable = "InfernoDragon_EV1_AttackCount", Value = "0" },
		{ ClassType = "ActionSetVariable", Variable = "InfernoDragon_EV1_AttackCount", Value = "0" },
		{ ClassType = "ActionSetVariable", Variable = "InfernoDragon_EV1_AttackCount", Value = "0" }
	]
