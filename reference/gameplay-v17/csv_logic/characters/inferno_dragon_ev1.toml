	EffectFlags = "FollowParent,ParticlesFollowParent,LinkLifeToActionLife,Looping"
	Singleton = true
	ForceStopIfTrue = "InfernoDragon_EV1_AttackCount >= 9 || InfernoDragon_EV1_AttackCount < 4"
