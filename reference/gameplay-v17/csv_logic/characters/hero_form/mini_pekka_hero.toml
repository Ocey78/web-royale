[STATS.minipekka_hero_ability]
		OverrideStringValue = "TID_STATS_ABILITIES_SINGLEUSE"
		Unit = "TID"
		TID = "TID_ABILITY_STAT_COOLDOWN"
		Icon = "icons_stats_cooldown"
	[[STATS.minipekka_hero_ability.stats]]
		OverrideIntValue = 4000
		Value2 = "cooking_time"
		Unit = "TIME"
		TID = "TID_SPELL_ATTRIBUTE_COOKING_TIME"
		Icon = "icons_stats_cooking_time"
	[[STATS.minipekka_hero_ability.stats]]
		OverrideStringValue = "TID_HERO_MINIPEKKA_LEVELRANGE"
		Unit = "TID"
		TID = "TID_SPELL_ATTRIBUTE_BONUS_LEVELS"
		Icon = "icons_stats_level_bonus"
	[[STATS.minipekka_hero_ability.stats]]
		VariableValue = "MiniPekka_hero_heal_percent"
		Unit = "PERCENT_NOSIGN"
		TID = "TID_SPELL_ATTRIBUTE_MATH_HEAL"
		Icon = "icons_stats_hp_activation"
