[ACTION.IceWizardHero_starting_actions]
ClassType = "ActionGroup"
SubActions = ["IceWizardHero_wait_to_not_be_active_champion"]
	[ACTION.IceWizardHero_wait_to_not_be_active_champion]
	ClassType			= "ActionWaitToActivate"
	Condition			= "(!is_active_or_secondary_champion && !IceWizardHero_is_pending_ability) || IceWizardHero_has_spawn_cube > 0"
	OnActivateAction	= "IceWizardHero_run_on_attached_ice"
	
		[ACTION.IceWizardHero_run_on_attached_ice]
		ClassType	= "ActionRunOnAttached"
		ActionToRun	= "IceWizardHero_attached_disappear"
[ACTION.IceWizardHero_hide_attached]
			ClassType	= "ActionHide"
[ACTION.IceWizardHero_ability_activation_actions]
ClassType = "ActionGroup"
SubActions = ["IceWizardHero_set_can_play_ability_true","IceWizardHero_ability_pending_vfx", "IceWizardHero_interval_find_valid_target", "IceWizardHero_wait_to_activate_ability", "IceWizardHero_ability_button_pending"]
ContextMode = "Create"
	[ACTION.IceWizardHero_ability_pending_vfx]
	ClassType = "ActionPlayEffect"
	Effect = "vfx_icewizard_hero_ability_ready"
	EffectFlags = "FollowParent, LinkLifeToActionLife, Looping"
	Singleton = true
	ExecuteIfTrue = "is_active_or_secondary_champion"
	ForceStopIfTrue = "!is_active_or_secondary_champion || as_int(#AbilityPlayed, 0) > 0 || IceWizardHero_ability_from_kill > 0"
	[ACTION.IceWizardHero_interval_find_valid_target]
	ClassType = "ActionInterval"
	Interval = 50
	ActionToExecute = "IceWizardHero_write_result_to_context"
	ForceStopIfTrue = "as_int(#HasValidTarget) != -1 || IceWizardHero_ability_from_kill > 0"
		[ACTION.IceWizardHero_write_result_to_context]
		ClassType = "ActionRunActionOnResolvedGameObjects"
		Resolver = "IceWizardHero_target_resolver"
		Amount = 1
		Action = "ice_wizard_hero_register_target"
		ExecuteIfTrue = "IceWizardHero_ability_from_kill == 0"
			[ACTION.ice_wizard_hero_register_target]
			ClassType = "ActionGroup"
			SubActions = ["ice_wiz_hero_register_target_globalID", "ice_wizard_hero_register_target_posX", "ice_wizard_hero_register_target_posY", "ice_wizard_hero_register_target_team_index", "ice_wizard_hero_register_target_radius"]
			ContextMode = "Inherit"
			AbortIfInstigatorDies = false
				[ACTION.ice_wiz_hero_register_target_globalID]
				ClassType = "ActionBlackboardSetInt"
				Key = "HasValidTarget"
				Value = "self"
				AbortIfInstigatorDies = false
				[ACTION.ice_wizard_hero_register_target_posX]
				ClassType = "ActionBlackboardSetInt"
				Key = "PosX"
				Value = "x"
				AbortIfInstigatorDies = false
				[ACTION.ice_wizard_hero_register_target_posY]
				ClassType = "ActionBlackboardSetInt"
				Key = "PosY"
				Value = "y"
				AbortIfInstigatorDies = false
				[ACTION.ice_wizard_hero_register_target_team_index]
				ClassType = "ActionBlackboardSetInt"
				Key = "TeamIndex"
				Value = "team_index"
				AbortIfInstigatorDies = false
				[ACTION.ice_wizard_hero_register_target_radius]
				ClassType = "ActionBlackboardSetInt"
				Key = "Radius"
				Value = "get_radius()"
	[ACTION.IceWizardHero_wait_to_activate_ability]
	ClassType			= "ActionWaitToActivate"
	Condition			= "as_int(#HasValidTarget) != -1"
	OnActivateAction	= "IceWizardHero_ability_actions"
	ForceStopIfTrue		= "IceWizardHero_ability_from_kill > 0"
	[ACTION.IceWizardHero_ability_button_pending]
	ClassType				= "ActionOverrideAbilityButtonState"
	ChampionCharacterData	= "IceWizardHero"
	Persistent				= true
	ApplyImmediate			= true
	StateToSet				= "ChampionPending"
	ExecuteIfTrue			= "is_active_or_secondary_champion"
	ForceStopIfTrue			= "!is_active_or_secondary_champion || as_int(#AbilityPlayed) > 0"
[ACTION.IceWizardHero_ability_actions]
ClassType	= "ActionGroup"
SubActions	= ["IceWizardHero_set_ability_played_to_context", "IceWizardHero_spawn_cube", "IceWizardHero_on_attached_action", "IceWizardHero_set_can_play_ability_false"]
SubActionsDelay = [0, 100, 0]
ContextMode 	= "Inherit"
	[ACTION.IceWizardHero_set_ability_played_to_context]
	ClassType	= "ActionBlackboardSetInt"
	Key			= "AbilityPlayed"
	Value		= "1"
	
		[ACTION.IceWizardHero_spawn_cube]
		ClassType = "ActionFilter"
		Condition = "is_valid_position(as_int(#PosX), as_int(#PosY) + (as_int(#Radius) + 1000) * team_y_direction(as_int(#TeamIndex))) > 0"
		OnTrueAction = "IceWizardHero_spawn_cube_on_true"
		OnFalseAction = "IceWizardHero_spawn_cube_on_false"
		AbortIfInstigatorDies = false
			[ACTION.IceWizardHero_spawn_cube_on_true]
			ClassType = "ActionGroup"
			SubActions = ["IceWizardHero_spawn_cube_on_true_register_y", "IceWizardHero_spawn_cube_on_true_register_x", "IceWizardHero_spawn_dummy_cube"]
			ContextMode = "Inherit"
			AbortIfInstigatorDies = false
				[ACTION.IceWizardHero_spawn_cube_on_true_register_y]
				ClassType = "ActionBlackboardSetInt"
				Key = "PosY"
				Value = "as_int(#PosY) + (as_int(#Radius) + 1000) * team_y_direction(as_int(#TeamIndex))"
				AbortIfInstigatorDies = false
				[ACTION.IceWizardHero_spawn_cube_on_true_register_x]
				ClassType = "ActionBlackboardSetInt"
				Key = "PosX"
				Value = "as_int(#PosX)"
				AbortIfInstigatorDies = false
					[ACTION.IceWizardHero_spawn_dummy_cube]
					ClassType = "ActionSpawnToLocation"
					SpawnType = "AreaEffectType"
					SpawnData = "IceWizardHero_FreezeAeo_Dummy"
					YPositionExpression = "as_int(#PosY, 0)"
					XPositionExpression = "as_int(#PosX, 0)"
					UseDeploy = false
					ParentGOAsSource = true
					AbortIfInstigatorDies = false
					NextAction = "ice_wizard_hero_set_spawned_cube_true"
					NextActionWait = true
					ExecuteIfTrue = "IceWizardHero_has_spawn_cube == 0"
						[ACTION.ice_wizard_hero_set_spawned_cube_true]
						ClassType = "ActionSetVariable"
						Variable = "IceWizardHero_has_spawn_cube"
						Value = "1"
						NextAction = "IceWizardHero_set_cube_inflight_false"
						NextActionWait = true
			[ACTION.IceWizardHero_spawn_cube_on_false]
			ClassType = "ActionGroup"
			SubActions = ["IceWizardHero_spawn_cube_on_false_register_y", "IceWizardHero_spawn_cube_on_true_register_x", "IceWizardHero_spawn_dummy_cube"]
			ContextMode = "Inherit"
				[ACTION.IceWizardHero_spawn_cube_on_false_register_y]
				ClassType = "ActionBlackboardSetInt"
				Key = "PosY"
				Value = "as_int(#PosY) + as_int(#Radius) * team_y_direction(as_int(#TeamIndex))"
	[ACTION.IceWizardHero_on_attached_action]
	ClassType	= "ActionRunOnAttached"
	ActionToRun	= "IceWizardHero_actions_on_floating_ice"
		[ACTION.IceWizardHero_actions_on_floating_ice]
		ClassType		= "ActionGroup"
		SubActions		= ["IceWizardHero_attached_play_effect","IceWizardHero_attached_disappear"]
		SubActionsDelay	= [0, 0]
		ContextMode		= "Create"
		
			[ACTION.IceWizardHero_attached_play_effect]
			ClassType	= "ActionPlayEffect"
			Effect		= "vfx_icewizard_hero_ability_use"
			[ACTION.IceWizardHero_attached_disappear]
			ClassType		= "ActionGroup"
			SubActions		= ["IceWizardHero_attached_play_animation", "IceWizardHero_attached_hide", "IceWizardHero_attached_wait_to_reapper"]
			SubActionsDelay	= [0, 400, 0]
			ContextMode		= "Inherit"
				[ACTION.IceWizardHero_attached_play_animation]
				ClassType			= "ActionRunForcedAnimationOnce"
				CustomStateNumber	= 2
				PlaybackDuration = -1
ForcedDuration		= 450
				
				[ACTION.IceWizardHero_attached_hide]
				ClassType		= "ActionHide"
				ForceStopIfTrue	= "as_int(#TimeIsOver) > 0 && ability_charges_left > 0"
				NextAction		= "IceWizardHero_attached_timer"
					[ACTION.IceWizardHero_attached_timer]
					ClassType		= "ActionInterval"
Interval		= 4000
StartCounterAt	= 4000
					ActionToExecute	= "IceWizardHero_attached_stop_hide_write_to_context"
					ForceStopIfTrue	= "as_int(#TimeIsOver) > 0"
						[ACTION.IceWizardHero_attached_stop_hide_write_to_context]
						ClassType	= "ActionBlackboardSetInt"
						Key			= "TimeIsOver"
						Value		= "1"
				
				[ACTION.IceWizardHero_attached_wait_to_reapper]
				ClassType = "ActionWaitToActivate"
				Condition = "as_int(#TimeIsOver) > 0 && ability_charges_left > 0"
				OnActivateAction = "IceWizardHero_attached_reapper"
[ACTION.IceWizardHero_attached_reapper]
					ClassType		= "ActionGroup"
					SubActions		= ["IceWizardHero_attached_play_animation_reapper"]
					SubActionsDelay	= [0]
					
						[ACTION.IceWizardHero_attached_play_animation_reapper]
						ClassType = "ActionRunForcedAnimationOnce"
						CustomStateNumber = 1
