[ACTION.IceWizardHero_ability_from_death_actions]
ClassType = "ActionGroup"
SubActions = ["IceWizardHero_death_find_target", "IceWizardHero_set_cube_inflight_false", "IceWizardHero_set_can_play_ability_false_no_inflight"]
SubActionsDelay = [0, 0, 0]
ContextMode = "Create"
ExecuteIfTrue = "(IceWizardHero_cube_inflight == 1 || IceWizardHero_is_pending_ability == 1) && IceWizardHero_ability_from_kill == 0"
	[ACTION.IceWizardHero_death_find_target]
	ClassType = "ActionRunActionOnResolvedGameObjects"
	Resolver = "IceWizardHero_target_resolver"
	Action = "IceWizardHero_death_spawn_cube"
	Amount = 1
		[ACTION.IceWizardHero_death_spawn_cube]
		ClassType = "ActionFilter"
		Condition = "is_valid_position(x, y + (get_radius() + 1000) * team_y_direction(team_index)) > 0"
		OnTrueAction = "IceWizardHero_death_spawn_cube_away"
		OnFalseAction = "IceWizardHero_death_spawn_cube_adjacent"
			[ACTION.IceWizardHero_death_spawn_cube_away]
			ClassType = "ActionSpawnToLocation"
			SpawnType = "CharacterType"
			SpawnData = "IceWizardHero_IceCube"
			YPositionExpression = "y + (get_radius() + 1000) * team_y_direction(team_index)"
			XPositionExpression = "x"
			UseDeploy = true
			[ACTION.IceWizardHero_death_spawn_cube_adjacent]
			ClassType = "ActionSpawnToLocation"
			SpawnType = "CharacterType"
			SpawnData = "IceWizardHero_IceCube"
			YPositionExpression = "y + get_radius() * team_y_direction(team_index)"
			XPositionExpression = "x"
			UseDeploy = true
