	[[STATS.giant_hero_ability.stats]]
		Value = "landingdamage"
		Unit = "INTEGER"
		TID = "TID_SPELL_ATTRIBUTE_THROW_DAMAGE"
		Icon = "icons_stats_dmg"
	[[STATS.giant_hero_ability.stats]]
