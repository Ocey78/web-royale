[EXT.Pekka_EV1]
	Base = "CHARACTER.Pekka"
	HealthBar = "Medium_EV1"
	OnKilledDoneAction="PekkaEV1_OnKill"
	CustomSpawnFilter = "filter_card_evolution"
	OnStartingClientActions=["PekkaEvoVisual"]
	ClonedVersion="Pekka"
	FileName="sc/chr_pekka_evolution.sc"
	BlueExportName="pekka_evolution"
    RedExportName="pekka_evolution_red"
	Scale = 75
	ShadowScaleX = 85
    ShadowScaleY = 80
    ShadowY = 20
	ShadowSkew = 25
	PrestigeSWF=""
	PrestigeExportName=""
	PrestigeExportName2=""
	PrestigeExportName3=""
	PrestigeRedExportName=""
	PrestigeRedExportName2=""
	PrestigeRedExportName3=""
	DeathEffect="Death_card_evolution_M"
	SpawnEffect="vfx_pekka_evo_deploy"
	DeployBaseAnimExportName="filter_deploy_unit_legendary"
	MoveEffect = "Pekka_Evo_steps"
	DamageEffect = "vfx_pekka_evo_hit"
	AttackStartEffect = "Pekka_Evo_attack_start"
	StatsTags.Damage = "damage"
	StatsTags.Hitpoints = "hitpoints"
	StatsTags.HitSpeed = "hit_speed"
	StatsTags.Targets = "targets"
	StatsTags.Speed = "speed"
	StatsTags.Range = "range"
	
[ACTION.PekkaEV1_OnKill]
	ClassType = "ActionGroup"
	SubActions = ["PekkaEV1_WriteVictimHp", "PekkaEV1_SoulDrain"]
	SubActionsDelay = [0, 0]
	ContextMode = "Create"
[ACTION.PekkaEV1_WriteVictimHp]
	ClassType = "ActionWriteInstigatorInfoToContext"
	HitpointsKey = "victim_hp"
	ShieldHitpointsKey = "victim_shield_hp"
	HitpointsLevelIndex = 10
[ACTION.PekkaEV1_SoulDrain]
	ClassType = "ActionSoulDrain"
	Effect = "pekka_evo_butterfly_explosion"
	EffectAbsolutePositionToParent = true
	ConstantFlightDuration = 700
	MinVisualWaitTime = 500
	MaxVisualWaitTime = 500
	MinWobble = 200
	MaxWobble = 200
	UseLerpForSouls = true
	FlipPivotOffsetIfTopBottom = true
	ActionOnTargetReached = "PekkaEV1_SoulArrived"
[ACTION.PekkaEV1_SoulArrived]
	ClassType = "ActionGroup"
	SubActions = ["PekkaEV1_SoulArrived_FX", "PekkaEV1_Heal"]
	SubActionsDelay = [0, 0]
	ContextMode = "Inherit"
[ACTION.PekkaEV1_SoulArrived_FX]
	ClassType = "ActionPlayEffect"
	Effect = "pekka_evo_gain_soul_glow"
	EffectFlags = "FollowParent"
[ACTION.PekkaEV1_Heal]
	ClassType="ActionSelect"
	PerActionConditions=[
	"as_int(#victim_hp, 0) + as_int(#victim_shield_hp, 0) < 990",
	"as_int(#victim_hp, 0) + as_int(#victim_shield_hp, 0) < 1990"
	]
[[ACTION.PekkaEV1_Heal.SubActions]]
    ClassType = "ActionSpawn"
    SpawnType = "BuffType"
    SpawnTime = 50
    SpawnData = "PekkaEV1_HealMin"
	ParentGOAsSource = true
[[ACTION.PekkaEV1_Heal.SubActions]]
    ClassType = "ActionSpawn"
    SpawnType = "BuffType"
    SpawnTime = 50
    SpawnData = "PekkaEV1_HealMed"
	ParentGOAsSource = true
[[ACTION.PekkaEV1_Heal.SubActions]]
    ClassType = "ActionSpawn"
    SpawnType = "BuffType"
    SpawnTime = 50
    SpawnData = "PekkaEV1_HealMax"
	ParentGOAsSource = true
[BUFF.PekkaEV1_HealMin]
	Rarity = "Common"
	HitFrequency = 50
	HealPerSecond = 1320
	AllowedOverHealPerc = 150
	OnStartAction = "PekkaHealing"
	StatsTags.HealMax = "healing_min"
	StatsTags.HitFrequency = "healing_hit_frequency"
	StatsTags.AllowedOverHealPerc = "max_overheal"
[BUFF.PekkaEV1_HealMed]
	Rarity = "Common"
	HitFrequency = 50
	HealPerSecond = 2500
	AllowedOverHealPerc = 150
	OnStartAction = "PekkaHealing"
[BUFF.PekkaEV1_HealMax]
	Rarity = "Common"
	HitFrequency = 50
	HealPerSecond = 4740
	AllowedOverHealPerc = 150
	OnStartAction = "PekkaHealing"
	StatsTags.HealMax = "healing_max"
[ACTION.PekkaHealing]
	ClassType="ActionPlayEffect"
	Effect="filter_pekka_evo_armor_glow"
	EffectFlags="FilterCanModifyTransform"
	SpriteName="PekkaGlowing"
	ActionDelay=1000
[CLIENT_ACTION.PekkaEvoVisual]
	ClassType="ClientActionAnimatorLayer"
	LayerName="PekkaGlowing"
	Filename="sc/chr_pekka_evolution.sc"
	BlueExportName="pekka_evolution_armor"
	RedExportName="pekka_evolution_armor"
	Visible=true
